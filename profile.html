<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#32175a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="src/styles.css?v=37" />
    <title>Profil | TatortTracker2</title>
  </head>
  <body class="profile-page">
    <main class="profile-shell">
      <section class="profile-hero" aria-labelledby="profile-title">
        <div class="profile-summary">
          <span id="profile-count">- / - Fällen</span>
          <strong id="profile-percent">-</strong>
          <p id="profile-username">Wird geladen ...</p>
          <p id="profile-rank-title"></p>
          <p id="profile-friend-code"></p>
        </div>
        <div class="profile-radar" aria-hidden="true">
          <span class="radar-ring radar-ring-outer"></span>
          <span class="radar-ring radar-ring-inner"></span>
          <span class="radar-core"></span>
        </div>
      </section>

      <section class="profile-menu" aria-label="Profilstatistik">
        <button data-profile-stat="best">Beste Fälle</button>
        <button data-profile-stat="worst">Schlechteste Fälle</button>
        <button data-profile-stat="teams">Beste Teams</button>
        <button data-profile-stat="worstTeams">Schlechteste Teams</button>
        <button data-profile-stat="cities">Beste Städte</button>
        <button data-profile-stat="worstCities">Schlechteste Städte</button>
        <button data-profile-stat="average"><span>Durchschnitt</span><strong id="profile-overall-average">-</strong></button>
        <button data-profile-stat="scary">Gruseligste Fälle</button>
      </section>

      <button id="profile-logout" class="profile-logout" type="button">Abmelden</button>

      <div id="profile-stat-modal" class="profile-stat-modal" hidden>
        <div class="profile-stat-backdrop" data-close-profile-stat></div>
        <section class="profile-stat-dialog" role="dialog" aria-modal="true" aria-labelledby="profile-stat-title">
          <div class="profile-stat-header"><h2 id="profile-stat-title"></h2><button class="profile-stat-close" type="button" data-close-profile-stat aria-label="Schließen">×</button></div>
          <div id="profile-stat-list" class="profile-stat-list"></div>
        </section>
      </div>

      <nav class="profile-nav" aria-label="Hauptnavigation">
        <a href="index.html?episodes=1#episodes" onclick="sessionStorage.setItem('tatorttracker.open-episodes','1')" aria-label="Episoden" title="Episoden">⌕</a>
        <a href="social.html" aria-label="Social" title="Social">♥</a>
        <a class="is-active" href="profile.html" aria-label="Profil" title="Profil">●</a>
      </nav>
      <p id="profile-status" class="profile-status" role="status"></p>
    </main>
    <script type="module" src="src/profile.js?v=6"></script>
  </body>
</html>
